name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API key, a signing secret, a recording or a real phone number.** For a security problem use SECURITY.md instead of an issue.
  - type: input
    id: version
    attributes:
      label: n8n-nodes-ringee version
    validations:
      required: true
  - type: input
    id: n8n
    attributes:
      label: n8n version and hosting (self-hosted, Docker, Cloud)
    validations:
      required: true
  - type: dropdown
    id: ringee
    attributes:
      label: Ringee
      options: [Ringee Cloud, Self-hosted Ringee]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The resource and operation, and the error text. Redact numbers and keys.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
